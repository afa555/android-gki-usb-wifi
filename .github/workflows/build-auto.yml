name: Build Wi-Fi modules (parametrized)

on:
  workflow_dispatch:
    inputs:
      ksrc_repo:
        description: "Kernel source repo (GKI common for loadable KCFI modules)"
        required: true
        default: "https://android.googlesource.com/kernel/common"
      kcommit:
        description: "Kernel branch/tag to check out"
        required: true
        default: "android16-6.12-2025-06_r8"
      clang_ver:
        description: "Android Clang version (r536225 matches NX809J device.config /proc/version)."
        required: true
        default: "clang-r536225"
      crc_source:
        description: "CRC map source: vmlinux (build's own, self-consistent) | device (device-crcs.txt override)"
        required: true
        default: "vmlinux"
      module_layout_crc:
        description: "Only with crc_source=device: override module_layout CRC"
        required: false
        default: ""
      btf:
        description: "Keep CONFIG_DEBUG_INFO_BTF? (y = device has BTF=y)"
        required: true
        default: "y"
      lto:
        description: "LTO mode to match device: full | thin | none"
        required: true
        default: "none"
      driver:
        description: "Driver: mt76x2u | mt76x0u | mt7601u | rt2800usb | ath9k_htc | rtl8xxxu | rtl88xxau_oot"
        required: true
        default: "mt76x2u"
      oot_repo:
        description: "For rtl88xxau_oot only: git URL of the out-of-tree driver"
        required: false
        default: "https://github.com/aircrack-ng/rtl8812au"
      oot_branch:
        description: "For rtl88xxau_oot only: branch/tag of that repo"
        required: false
        default: "v5.6.4.2"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo (needed for packaging/ templates)
        uses: actions/checkout@v4

      - name: Show inputs
        run: |
          echo "repo    = ${{ github.event.inputs.ksrc_repo }}"
          echo "commit  = ${{ github.event.inputs.kcommit }}"
          echo "clang   = ${{ github.event.inputs.clang_ver }}"
          echo "btf     = ${{ github.event.inputs.btf }}"
          echo "lto     = ${{ github.event.inputs.lto }}"
          echo "crc     = ${{ github.event.inputs.module_layout_crc }}"
          echo "driver  = ${{ github.event.inputs.driver }}"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
              lz4 cpio kmod git curl zip file dwarves libdw-dev zlib1g-dev libzstd-dev
          sudo apt-get install -y cmake libbpf-dev pkg-config
          git clone --depth 1 -b v1.27 https://github.com/acmel/dwarves.git /tmp/dwarves
          sed -i 's/cmake_minimum_required(VERSION 2.8.12)/cmake_minimum_required(VERSION 3.5)/' /tmp/dwarves/CMakeLists.txt
          cmake -S /tmp/dwarves -B /tmp/dwarves/build \
            -D__LIB=lib -DLIBBPF_EMBEDDED=OFF -DCMAKE_BUILD_TYPE=Release
          make -C /tmp/dwarves/build -j$(nproc)
          sudo make -C /tmp/dwarves/build install
          sudo ldconfig
          export PATH=/usr/local/bin:$PATH
          hash -r
          pahole --version

      - name: Install Rust 1.82.0 and bindgen
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.82.0 --component rust-src
          . "$HOME/.cargo/env"
          rustup component add rust-src
          cargo install --locked bindgen-cli@0.69.5
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustc --version
          bindgen --version

      - name: Fetch GKI kernel source
        run: |
          set -e
          git clone --depth 1 -b "${{ github.event.inputs.kcommit }}" \
            "${{ github.event.inputs.ksrc_repo }}" ks
          test -f ks/Makefile
          head -3 ks/Makefile

      - name: Patch drivers for GKI KMI limits
        working-directory: ks
        env:
          DRIVER: ${{ github.event.inputs.driver }}
        run: |
          # GKI trims symbol exports to the KMI list (CONFIG_TRIM_UNUSED_KSYMS).
          # A driver can build fine yet fail to load with "Unknown symbol X"
          # because X simply isn't exported by the running kernel.
          #
          # mt7601u calls firmware_request_cache(), which is NOT in the KMI.
          # That call only pre-caches firmware for suspend/resume, so making it
          # a no-op is safe: the driver still loads firmware normally via
          # request_firmware().
          if [ "$DRIVER" = "mt7601u" ]; then
            F=$(grep -rl 'firmware_request_cache' drivers/net/wireless/mediatek/mt7601u/ | head -1)
            if [ -n "$F" ]; then
              echo "patching $F (firmware_request_cache -> no-op)"
              LINE=$(grep -n 'firmware_request_cache(' "$F" | head -1 | cut -d: -f1)
              sed -i "${LINE}i #define firmware_request_cache(d, n) (0) /* GKI: symbol not in KMI */" "$F"
              grep -n -B1 -A1 'firmware_request_cache' "$F" | head -20
            else
              echo "note: firmware_request_cache not found in mt7601u sources (newer kernel?) - nothing to patch"
            fi
          else
            echo "no KMI patches needed for $DRIVER"
          fi

      - name: Fetch Android Clang
        run: |
          mkdir -p clang
          CV="${{ github.event.inputs.clang_ver }}"
          got=0
          fetch() {  # retry a URL up to 3 times before giving up on it
            for try in 1 2 3; do
              if curl -fsSL --retry 3 --retry-delay 2 "$1" -o c.tar.gz \
                 && file c.tar.gz | grep -q gzip; then return 0; fi
              echo "   retry $try failed"; sleep 3
            done
            return 1
          }
          for BR in android12-release android13-release android14-release android15-release android16-release main master; do
            URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/$BR/$CV.tar.gz"
            echo "Trying $BR ..."
            if fetch "$URL"; then
              tar -xzf c.tar.gz -C clang && got=1 && echo "OK from $BR" && break
            fi
            rm -f c.tar.gz
          done
          if [ "$got" != "1" ]; then
            echo "::error::Could not fetch $CV from any known branch (after retries). Re-run the job; googlesource occasionally drops HTTP/2 streams."
            exit 1
          fi
          clang/bin/clang --version

      - name: Sanity-check workflow shell blocks
        run: |
          # Catch shell syntax errors in this workflow early (a bad line
          # continuation used to fail 4 minutes in, after the clang download).
          echo "checking driver case block syntax..."
          sh -n .github/workflows/../../scripts/detect.sh && echo "detect.sh OK"
          sh -n scripts/install.sh && echo "install.sh OK"
          sh -n packaging/service.sh && echo "service.sh OK"
          sh -n packaging/action.sh && echo "action.sh OK"

      - name: Configure (NX809J load gauntlet)
        working-directory: ks
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$HOME/.cargo/bin:$PATH
          export RUSTC="$(command -v rustc)"
          RUST_SYSROOT="$(rustc --print sysroot)"
          export RUST_LIB_SRC="$RUST_SYSROOT/lib/rustlib/src/rust/library"
          export BINDGEN="$(command -v bindgen)"
          export LOCALVERSION=
          mkdir -p out
          touch abi_symbollist.raw
          cp "$GITHUB_WORKSPACE/device.config" out/.config
          ./scripts/config --file out/.config \
            -e MODULES -e MODVERSIONS -e KPROBES -e KALLSYMS_ALL \
            -e CFI_CLANG -d LTO_CLANG_FULL -d LTO_CLANG_THIN -e LTO_NONE \
            -e CFI_ICALL_NORMALIZE_INTEGERS \
            -e DEBUG_INFO_BTF -e RUST \
            -e WLAN -m CFG80211 -m MAC80211 -e WLAN_VENDOR_MEDIATEK \
            -k -m MT76_CORE -m MT76_USB -m MT76x02_LIB -m MT76x02_USB \
            -m MT76x2_COMMON -m MT76x2U
          ./scripts/config --file out/.config --set-str MODULE_SIG_PROTECT_LIST ""
          ./scripts/config --file out/.config --set-str LOCALVERSION "-android16-5-gf1bdb13583da-ab13761046-4k"
          ./scripts/config --file out/.config -d LOCALVERSION_AUTO
          make LLVM=1 ARCH=arm64 O=out olddefconfig
          grep -E "CONFIG_(CFG80211=|MAC80211=|MT76|MODVERSIONS=|CFI_CLANG=|CFI_ICALL_NORMALIZE_INTEGERS=|MODULE_SIG=|MODULE_SIG_SHA1=|MODULE_SIG_SHA256=|MODULE_SIG_PROTECT=|TRIM_UNUSED_KSYMS=|LTO_NONE=|DEBUG_INFO_BTF=|RUST=|LOCALVERSION|CC_VERSION_TEXT)" out/.config || true

      - name: Prepare kernel for external modules
        working-directory: ks
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$HOME/.cargo/bin:$PATH
          export RUSTC="$(command -v rustc)"
          RUST_SYSROOT="$(rustc --print sysroot)"
          export RUST_LIB_SRC="$RUST_SYSROOT/lib/rustlib/src/rust/library"
          export BINDGEN="$(command -v bindgen)"
          export LOCALVERSION=
          # olddefconfig updates .config but not auto.conf; this drives KCFI flags
          make LLVM=1 ARCH=arm64 O=out modules_prepare prepare scripts -j$(nproc)
          grep -E "CONFIG_(CFG80211=|MAC80211=|MT76|MODVERSIONS=|CFI_CLANG=|CFI_ICALL_NORMALIZE_INTEGERS=|MODULE_SIG=|MODULE_SIG_SHA256=|LTO_NONE=)" out/.config || true

      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 24G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Build in-tree modules
        working-directory: ks
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$HOME/.cargo/bin:$PATH
          export RUSTC="$(command -v rustc)"
          RUST_SYSROOT="$(rustc --print sysroot)"
          export RUST_LIB_SRC="$RUST_SYSROOT/lib/rustlib/src/rust/library"
          export BINDGEN="$(command -v bindgen)"
          export LOCALVERSION=
          export LDFLAGS_MODULE="-z max-page-size=16384"
          make LLVM=1 ARCH=arm64 O=out LDFLAGS_MODULE="$LDFLAGS_MODULE" -j$(nproc)

      - name: Extract __crc_* from vmlinux
        run: |
          set -e
          test -f ks/out/vmlinux || { echo "::error::ks/out/vmlinux not found"; exit 1; }
          # Absolute __crc_* symbols carry the CRC the kernel expects for each
          # exported symbol. nm prints them as "<value> A __crc_<name>".
          nm ks/out/vmlinux | awk '$3 ~ /^__crc_/ {v=$1; sub(/^__crc_/,"",$3); print v" "$3}' \
            | sort -u > crc_map.txt
          echo "CRC symbols extracted from vmlinux: $(wc -l < crc_map.txt)"
          grep -qE ' module_layout$' crc_map.txt \
            || { echo "::error::module_layout CRC missing from vmlinux"; exit 1; }
          echo "--- sample ---"; head -5 crc_map.txt
          if [ "${{ github.event.inputs.crc_source }}" = "device" ]; then
            test -f device-crcs.txt || { echo "::error::crc_source=device but device-crcs.txt is missing"; exit 1; }
            echo "overriding with device-crcs.txt ($(wc -l < device-crcs.txt) symbols)"
            cat device-crcs.txt >> crc_map.txt
          fi

      - name: Build out-of-tree Realtek driver
        if: ${{ github.event.inputs.driver == 'rtl88xxau_oot' }}
        env:
          OOT_REPO: ${{ github.event.inputs.oot_repo }}
          OOT_BRANCH: ${{ github.event.inputs.oot_branch }}
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          git clone --depth 1 -b "$OOT_BRANCH" "$OOT_REPO" oot || \
          git clone --depth 1 "$OOT_REPO" oot
          cd oot
          echo "Building $(basename "$OOT_REPO") @ $OOT_BRANCH against prepared kernel..."
          # Most rtl88xxau Makefiles accept KSRC + cross vars
          make -j$(nproc) \
            KSRC="$GITHUB_WORKSPACE/ks/out" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 CC=clang LD=ld.lld \
            || { echo "::warning::OOT build failed with LLVM; retrying with default toolchain"; \
                 make -j$(nproc) KSRC="$GITHUB_WORKSPACE/ks/out" ARCH=arm64 || true; }
          find . -name "*.ko" -exec ls -la {} \;

      - name: Show module_layout CRC
        if: always()
        run: |
          echo "=== module_layout CRC (compare to your device!) ==="
          grep -w module_layout ks/out/Module.symvers 2>/dev/null || echo "not found"

      - name: Collect modules
        if: always()
        run: |
          mkdir -p ko
          # in-tree
          find ks/out -name "*.ko" \( \
            -name "mac80211.ko" -o -name "cfg80211.ko" -o -name "libarc4.ko" -o \
            -name "mt76*.ko" -o -name "mt7601u.ko" -o -name "rt2*.ko" -o -name "rt2800*.ko" -o \
            -name "ath*.ko" -o -name "rtl8xxxu.ko" \) -exec cp {} ko/ \; || true
          # out-of-tree (if built)
          find oot -name "*.ko" -exec cp {} ko/ \; 2>/dev/null || true
          cp ks/out/Module.symvers ko/ 2>/dev/null || true
          cp ks/out/.config ko/device-build.config 2>/dev/null || true
          cp ks/out/include/config/kernel.release ko/kernel.release 2>/dev/null || true
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          command -v llvm-strip
          for f in ko/*.ko; do llvm-strip --strip-debug "$f"; done
          echo "--- collected ---"; ls -la ko/

      - name: Patch module CRCs from crc_map.txt
        run: |
          python3 - "$GITHUB_WORKSPACE/ko" "$GITHUB_WORKSPACE/crc_map.txt" \
                   "$GITHUB_WORKSPACE/ko/Module.symvers" "$GITHUB_WORKSPACE/device-crcs.txt" \
                   "${{ github.event.inputs.crc_source }}" "${{ github.event.inputs.module_layout_crc }}" <<'PY'
          import pathlib, struct, sys
          kodir = pathlib.Path(sys.argv[1])
          crcfile = pathlib.Path(sys.argv[2])
          symvers = pathlib.Path(sys.argv[3])
          devfile = pathlib.Path(sys.argv[4])
          source = sys.argv[5]
          ml_crc = sys.argv[6].strip()

          def read_map(path):
              m = {}
              if path.exists():
                  for line in path.read_text(errors="replace").splitlines():
                      p = line.split()
                      if len(p) >= 2:
                          try:
                              m[p[1]] = int(p[0], 16)
                          except ValueError:
                              pass
              return m

          # Which symbols are exported by the kernel image itself (not by a
          # sibling module we are shipping). Only those need the device's CRCs;
          # symbols exported by our own .ko are consistent within the set.
          vmlinux_exports = set()
          if symvers.exists():
              for line in symvers.read_text(errors="replace").splitlines():
                  p = line.split("\t")
                  if len(p) >= 3 and p[2] == "vmlinux":
                      vmlinux_exports.add(p[1])

          if source == "device":
              want = read_map(devfile)
              if ml_crc:
                  want["module_layout"] = int(ml_crc, 16)
              print(f"CRC source: device-crcs.txt ({len(want)} symbols)")
          else:
              want = read_map(crcfile)
              print(f"CRC source: vmlinux ({len(want)} symbols)")

          def version_span(data):
              if data[:4] != b"\x7fELF" or data[4] != 2:
                  return None
              shoff = struct.unpack_from("<Q", data, 0x28)[0]
              shentsize, shnum, shstrndx = struct.unpack_from("<HHH", data, 0x3a)
              shstr = struct.unpack_from("<IIQQQQIIQQ", data, shoff + shstrndx * shentsize)
              names = data[shstr[4]:shstr[4] + shstr[5]]
              for i in range(shnum):
                  sh = struct.unpack_from("<IIQQQQIIQQ", data, shoff + i * shentsize)
                  n = sh[0]
                  end = names.find(b"\0", n)
                  if names[n:end] == b"__versions":
                      return sh[4], sh[5]
              return None

          total_changed = 0
          missing_all = {}
          unknown = set()
          for ko in sorted(kodir.glob("*.ko")):
              data = bytearray(ko.read_bytes())
              span = version_span(bytes(data))
              if not span:
                  print(f"{ko.name}: no __versions section")
                  continue
              off, size = span
              changed = missing = 0
              for pos in range(off, off + size, 64):
                  field = data[pos + 8:pos + 64]
                  end = field.find(b"\0")
                  if end <= 0:
                      continue
                  sym = field[:end].decode(errors="replace")
                  if sym not in vmlinux_exports:
                      # exported by a sibling module (or unknown); leave it alone
                      if sym not in want:
                          unknown.add(sym)
                      continue
                  if sym not in want:
                      missing += 1
                      missing_all.setdefault(sym, set()).add(ko.name)
                      continue
                  if struct.unpack_from("<Q", data, pos)[0] != want[sym]:
                      struct.pack_into("<Q", data, pos, want[sym])
                      changed += 1
              if changed:
                  ko.write_bytes(data)
              total_changed += changed
              print(f"{ko.name}: entries={size // 64} changed={changed} missing={missing}")

          if missing_all:
              print(f"::error::{len(missing_all)} kernel-exported symbols used by these modules are absent from the CRC map:")
              for sym in sorted(missing_all)[:40]:
                  print(f"   {sym}  <- {','.join(sorted(missing_all[sym]))}")
              print("::error::Supply a complete device CRC map (crc_source=device) or fix the kernel source/config.")
              raise SystemExit(1)
          print(f"CRC values rewritten: {total_changed} (map has {len(want)} symbols)")
          if total_changed == 0:
              print("::warning::The CRC map already equals the values embedded in the .ko.")
              print("::warning::If the device still reports 'disagrees about version of symbol',")
              print("::warning::the build source/config does not match the running kernel;")
              print("::warning::you must supply the device's real CRCs (crc_source=device).")
          PY

      - name: Package Magisk/KernelSU module
        id: pkg
        if: always()
        run: |
          set -e
          COMMIT="${{ github.event.inputs.kcommit }}"
          SHORT="$(echo "$COMMIT" | cut -c1-12)"
          DRIVER="${{ github.event.inputs.driver }}"

          # map driver -> USB bind name + firmware files to bundle
          case "$DRIVER" in
            mt76x2u)  DRVNAME=mt76x2u;  LEAF=mt76x2u.ko;  FW="mediatek/mt7662.bin mediatek/mt7662_rom_patch.bin"; USBID="0e8d:7612" ;;
            mt76x0u)  DRVNAME=mt76x0u;  LEAF=mt76x0u.ko;  FW="mediatek/mt7610u.bin"; USBID="0e8d:7610" ;;
            mt7601u)  DRVNAME=mt7601u;  LEAF=mt7601u.ko;  FW="mediatek/mt7601u.bin"; USBID="148f:7601" ;;
            rt2800usb) DRVNAME=rt2800usb; LEAF=rt2800usb.ko; FW=""; USBID="148f:5370" ;;
            ath9k_htc) DRVNAME=ath9k_htc; LEAF=ath9k_htc.ko; FW="ath9k_htc/htc_9271-1.4.0.fw ath9k_htc/htc_7010-1.4.0.fw"; USBID="0cf3:9271" ;;
            rtl8xxxu) DRVNAME=rtl8xxxu; LEAF=rtl8xxxu.ko; FW=""; USBID="0bda:8178" ;;
            *) echo "packaging: unsupported driver $DRIVER for Magisk zip (in-tree only)"; exit 0 ;;
          esac

          PKG="pkg"
          rm -rf "$PKG"; mkdir -p "$PKG/modules" "$PKG/firmware" "$PKG/META-INF/com/google/android"

          # modules from the collected ko/ dir
          cp ko/*.ko "$PKG/modules/" 2>/dev/null || true
          # NX809J stock kernel has CONFIG_CFG80211=n and CONFIG_CRYPTO_LIB_ARC4=m,
          # so mac80211 cannot resolve cfg80211_* / arc4_* until these load first.
          cp ko/Module.symvers "$PKG/modules/" 2>/dev/null || true

          # firmware (fetched from linux-firmware)
          LF="https://gitlab.com/kernel-firmware/linux-firmware/-/raw/main"
          for f in $FW; do
            out="$PKG/firmware/$(basename "$f")"
            curl -fsSL "$LF/$f" -o "$out" && echo "fw: $(basename "$f")" || echo "WARN: fw $f missing"
          done

          # module.prop (your design - commit hash in id/version, warning in desc)
          cat > "$PKG/module.prop" <<PROP
          id=gki_usb_wifi_${SHORT}_${DRIVER}
          name=GKI USB Wi-Fi (${DRIVER})
          version=${SHORT}
          versionCode=1
          author=markatsos
          description=Loads ${DRIVER} on vendor kernel commit ${SHORT}. DO NOT flash on a different kernel — module_layout CRC must match or it won't load.
          PROP

          # service.sh from template, with placeholders filled
          sed -e "s|__USB_ID__|$USBID|" \
              -e "s|__DRV_KO__|$LEAF|" \
              -e "s|__DRV_NAME__|$DRVNAME|" \
              packaging/service.sh > "$PKG/service.sh"
          cp packaging/uninstall.sh "$PKG/uninstall.sh"
          cp packaging/action.sh "$PKG/action.sh"
          chmod 755 "$PKG/service.sh" "$PKG/uninstall.sh" "$PKG/action.sh"
          # KernelSU/APatch read the same module.prop; declaring actionIcon is
          # harmless on Magisk and makes the Action button show on KernelSU.
          echo "actionIcon=" >> "$PKG/module.prop"

          # minimal updater-script so it flashes in Magisk/KernelSU/APatch
          cat > "$PKG/META-INF/com/google/android/update-binary" <<'UB'
          #!/sbin/sh
          # Magisk module installer shim
          umask 022
          OUTFD=$2; ZIP=$3
          . /data/adb/magisk/util_functions.sh 2>/dev/null || true
          install_module
          exit 0
          UB
          echo "#MAGISK" > "$PKG/META-INF/com/google/android/updater-script"

          # Do NOT zip here: actions/upload-artifact zips the folder contents for
          # us, so the downloaded file is already a flashable Magisk module
          # (module.prop/service.sh at the archive root). Zipping ourselves would
          # produce a zip-inside-a-zip that users must extract first.
          echo "module tree ready:"
          find "$PKG" -maxdepth 2 -type f | sort
          echo "zipname=gki-usb-wifi-${SHORT}-${DRIVER}" >> "$GITHUB_OUTPUT"

      - name: Upload Magisk module (flashable as-is)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # The downloaded file is named after this and contains the module tree
          # at its root -> flash it directly in Magisk/KernelSU, no extracting.
          name: ${{ steps.pkg.outputs.zipname || 'magisk-module' }}
          path: pkg/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modules
          path: ko/
